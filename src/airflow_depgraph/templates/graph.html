<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #fcfcfb; --panel: #ffffff; --fg: #0b0b0b; --mut: #52514e; --line: #e5e4e0; --acc: #2a78d6;
  --c-dag: #2a78d6; --c-asset: #eb6834; --c-trigger: #1baf7a; --c-sensor: #eda100;
  --critical: #d03b3b; --warning: #fab219; --edge: #b9b7b0; --guard: #8f8d86; --shadow: rgba(0, 0, 0, .15);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a19; --panel: #22221f; --fg: #f0efec; --mut: #c3c2b7; --line: #3a3935; --acc: #3987e5;
    --c-dag: #3987e5; --c-asset: #d95926; --c-trigger: #199e70; --c-sensor: #c98500; --edge: #55534d; --guard: #8a8880; --shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a19; --panel: #22221f; --fg: #f0efec; --mut: #c3c2b7; --line: #3a3935; --acc: #3987e5;
  --c-dag: #3987e5; --c-asset: #d95926; --c-trigger: #199e70; --c-sensor: #c98500; --edge: #55534d; --guard: #8a8880; --shadow: rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
header {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0; }
header .st { color: var(--mut); }
input[type=search] {
  font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--fg); flex: 1 1 260px; max-width: 420px; min-width: 0;
}
label.t { display: inline-flex; align-items: center; gap: 4px; color: var(--mut); cursor: pointer; }
.filters { display: contents; }  /* on desktop the toggles and legend sit in the header row */
#filtersBtn { display: none; font: inherit; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--acc); cursor: pointer; }
main { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }
aside {
  border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px;
  overflow: auto; font-size: 12.5px;
}
aside h2 { font-size: 14px; margin: 0 0 6px; word-break: break-all; }
aside h3 { font-size: 12px; color: var(--mut); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .03em; }
aside ul { margin: 0; padding-left: 16px; }
aside li { margin: 2px 0; cursor: pointer; word-break: break-all; }
aside li:hover { color: var(--acc); }
aside .hint { color: var(--mut); }
aside button { font: inherit; margin-top: 6px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--acc); cursor: pointer; }
aside h4 { margin: 10px 0 2px; font-size: 12px; color: var(--mut); font-weight: 600; }
aside input[type=search] { width: 100%; margin: 4px 0; }
header button { font: inherit; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--acc); cursor: pointer; }
aside a { color: var(--acc); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mut); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.legend i.sq { border-radius: 2px; }
.legend i.dia { border-radius: 2px; transform: rotate(45deg); background: var(--c-sensor); }
.legend i.tri {
  width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
  border-bottom: 11px solid var(--c-trigger); border-radius: 0;
}
.legend i.dia.inf { background: none; border: 2px dashed var(--c-sensor); }
.legend i.dia.grd { background: none; border: 2px dashed var(--mut); }
.legend i.ring { background: none; border: 2.5px solid var(--critical); }
.legend i.ring.warn { border-color: var(--warning); }
.legend i.ring.hl { border-color: var(--fg); }
#tip {
  position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 10px var(--shadow);
  display: none; max-width: 360px; word-break: break-all; z-index: 9;
}
text.lbl {
  font-size: 10px; fill: var(--fg); pointer-events: none; paint-order: stroke;
  stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
}
.badge { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 11px; background: var(--line); }
.badge.crit { background: var(--critical); color: #fff; }
.badge.warn { background: var(--warning); color: #0b0b0b; }
@media (max-width: 720px) {
  html, body { height: auto; min-height: 100%; }
  main { display: block; }
  svg { height: 60vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  header { padding: 8px 12px; gap: 6px 10px; }
  header h1 { font-size: 15px; }
  header .st { font-size: 12px; }
  #filtersBtn { display: inline-block; }
  header .filters { display: none; }
  body.filters-open header .filters { display: contents; }
}
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="st" id="stats">__STATS__</span>
  <span class="st" id="shown"></span>
  <span class="st" id="ver" hidden></span>
  <input id="q" type="search" placeholder="find a DAG or asset… (+dag, dag+, 2+dag+3)" autocomplete="off" aria-label="Search">
  <button type="button" id="fit" title="Zoom to fit all shown nodes">Fit</button>
  <button type="button" id="filtersBtn" aria-controls="filters">Filters</button>
  <div class="filters" id="filters">
  <label class="t"><input type="checkbox" id="hideAssets"> DAG→DAG (hide assets)</label>
  <label class="t"><input type="checkbox" id="onlyFail"> only failing + their chain</label>
  <label class="t"><input type="checkbox" id="blast"> blast radius</label>
  <label class="t"><input type="checkbox" id="onlyLinked" checked> only linked DAGs</label>
  <label class="t"><input type="checkbox" id="onlyActive" checked> only active DAGs</label>
  <label class="t" id="tagWrap"><input type="checkbox" id="onlyTags" checked> <span id="tagLbl">only tags</span></label>
  <label class="t" id="connWrap"><input type="checkbox" id="conn"> + linked DAGs of other teams</label>
  <label class="t" id="guardWrap"><input type="checkbox" id="showGuards"> show deploy guards</label>
  <label class="t" id="hlWrap"><input type="checkbox" id="hl"> __HL_LABEL__</label>
  <span class="legend">
    <span><i style="background:var(--c-dag)"></i>DAG</span>
    <span><i class="sq" style="background:var(--c-asset)"></i>asset</span>
    <span><i class="tri"></i>trigger</span>
    <span><i class="dia"></i>sensor</span>
    <span id="lgInf"><i class="dia inf"></i>inferred sensor</span>
    <span id="lgGuard"><i class="dia grd"></i>deploy guard</span>
    <span><i class="ring"></i>failed (pipeline)</span>
    <span><i class="ring warn"></i>failed (tests only)</span>
    <span id="lgHl"><i class="ring hl"></i>__HL_LABEL__</span>
  </span>
  </div>
</header>
<main>
  <svg id="g" role="img" aria-label="Dependency graph"></svg>
  <aside id="side"></aside>
</main>
<div id="tip"></div>

    if (!inM.has(e.t)) inM.set(e.t, []);

const TAGS = META.catalog === false ? [] : (META.tags || []);  // no catalog: no tags to filter on

    if (!isLink(y)) out.push(y);

  // A link node stays while it joins two kept nodes, or nothing around it was filtered out;
  // one left with no neighbour at all goes.
  const guards = box('showGuards').checked;
  const keep = new Set([...dags, ...DATA.nodes.filter(n => n.type !== 'dag' && (guards || n.kind !== 'guard')).map(n => n.id)]);

  for (let hop = 1; frontier.length && hop <= depth; hop++) {
    const next = [];
    for (const from of frontier) {
      const stack = [[from, null]], seenLinks = new Set();
      while (stack.length) {
        const [x, via] = stack.pop();
        for (const y of adj.get(x) || []) {
          if (byId.get(y).type === 'dag') {
            if (!seen.has(y)) { seen.add(y); next.push(y); out.push({id: y, hop, via: via ? byId.get(via).label : null}); }
          } else if (!seenLinks.has(y)) { seenLinks.add(y); stack.push([y, y]); }
        }
      }
    }
    frontier = next;
  }
  return out.sort((a, b) => a.hop - b.hop || byId.get(a.id).label.localeCompare(byId.get(b.id).label));
}

// The tag and active filters the graph applies to DAGs; the side lists use the same ones.
const passesDagFilters = n => (!(TAGS.length > 0 && box('onlyTags').checked) || hasTag(n)) && !(box('onlyActive').checked && n.paused);
// Unlinked DAGs that pass the filters, by name. A DAG linked only by a deploy guard counts as linked.
const listUnlinked = () => DATA.nodes.filter(n => n.type === 'dag' && n.unlinked && passesDagFilters(n)).sort((a, b) => a.label.localeCompare(b.label));

// Which filters hide node n right now, as [checkbox id, label, value that shows n].
function hiddenBy(n) {
  const why = [];
  if (n.type === 'dag') {
    if (loose(n) && box('onlyLinked').checked) why.push(['onlyLinked', 'only linked DAGs', false]);
    if (n.paused && box('onlyActive').checked) why.push(['onlyActive', 'only active DAGs', false]);
    if (TAGS.length && box('onlyTags').checked && !hasTag(n)) why.push(['onlyTags', 'only tags', false]);
  } else if (box('hideAssets').checked) why.push(['hideAssets', 'hide assets', false]);
  if (n.kind === 'guard' && !box('showGuards').checked) why.push(['showGuards', 'show deploy guards', true]);
  if (box('onlyFail').checked) why.push(['onlyFail', 'only failing', false]);
  if (!why.length) {  // hidden because its neighbours are: every filter that hides anything
    [['onlyLinked', 'only linked DAGs', false], ['onlyActive', 'only active DAGs', false], ['onlyTags', 'only tags', false]]
      .forEach(w => { if (box(w[0]).checked && !box(w[0]).closest('label').hidden) why.push(w); });
  }
  return why;
}

function hiddenNote(d) {
  if (nodeMap.has(d.id)) return '';
  const why = hiddenBy(d);
  return `<p class="hint">${esc(d.label)} is hidden by filters: ${esc(why.map(w => w[1]).join(', ') || 'the current view')}. ` +
    (why.length ? `<button type="button" id="reveal">Switch ${why.length > 1 ? 'them' : 'it'} off and show it</button>` : '') + '</p>';
}

function reveal(id) {
  hiddenBy(byId.get(id)).forEach(([cb, , v]) => { box(cb).checked = v; });
  buildAdj(); buildView(); syncHash();
  select(id);
  setTimeout(() => fitTo([id]), 900);
}

// Plain text for the Copy button: one hop, dag and via per line (via empty for a direct hop).
function hopText(hops) {
  return hops.map(h => `${h.hop}\t${byId.get(h.id).label}\t${h.via || ''}`).join('\n');
}

// Copies text; falls back to a selected textarea where the clipboard API is missing or refused.
function copyText(text, btn) {
  const label = btn.textContent;
  const done = ok => { btn.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => { btn.textContent = label; }, 1500); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { /* no clipboard here */ }
    ta.remove(); done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}

function wireRows(root) {
  root.querySelectorAll('li[data-id]').forEach(el => el.onclick = () => { select(el.dataset.id); fitTo([el.dataset.id]); });
}

// Panel with nothing selected: intro, the blast-radius list and the unlinked list.
function renderEmpty(msg) {
  let html = `<h2>${esc(msg || 'Click a node')}</h2>`;
  if (!msg) html += `<p class="hint">Node size shows how many DAGs depend on it, transitively. Click to highlight everything upstream and downstream. Double-click pins or releases a node. Scroll to zoom, drag to pan.<br><br>Search: <code>dag</code> focuses the first match, <code>+dag</code> adds its upstream, <code>dag+</code> its downstream, <code>2+dag+3</code> limits the depth.</p>`;
  if (box('blast').checked) {
    const failingDags = DATA.nodes.filter(n => n.type === 'dag' && failing(n) && passesDagFilters(n)).sort((a, b) => b.down - a.down || a.label.localeCompare(b.label));
    html += `<h3>Failing DAGs (${failingDags.length})</h3><ul>` + failingDags.map(n =>
      `<li data-id="${esc(n.id)}">⚠ ${esc(n.label)} <span class="hint">· ${n.down} downstream</span></li>`).join('') + '</ul>';
  }
  const unlinkedOn = !box('onlyLinked').checked;
  if (unlinkedOn) html += `<h3>DAGs without dependencies (${listUnlinked().length})</h3><input type="search" id="unlinkedQ" placeholder="filter…" aria-label="Filter DAGs without dependencies"><ul id="unlinkedUl"></ul>`;
  side.innerHTML = html;
  wireRows(side);
  if (unlinkedOn) {
    const ul = document.getElementById('unlinkedUl');
    const rows = q => listUnlinked().filter(n => n.label.toLowerCase().includes(q)).map(n =>
      `<li data-id="${esc(n.id)}">${esc(n.label)}${n.paused ? ' <span class="badge">paused</span>' : ''} <span class="hint">· ${esc(n.schedule || '—')}</span></li>`).join('') || '<li class="hint">no match</li>';
    ul.innerHTML = rows('');
    wireRows(ul);
    document.getElementById('unlinkedQ').oninput = e => { ul.innerHTML = rows(e.target.value.trim().toLowerCase()); wireRows(ul); };
  }
}

function renderSide(d, msg) {
  if (!d) { renderEmpty(msg); return; }
  const base = /^https?:\/\//.test(META.source || '') ? String(META.source).replace(/\/+$/, '') : '';
  const openLink = d.type === 'dag' && base ? `<p><a href="${esc(base + '/dags/' + encodeURIComponent(d.id.slice(4)))}" ${LINK_TARGET}>Open in Airflow ↗</a></p>` : '';
  if (loose(d)) {
    side.innerHTML = `<h2>${esc(d.label)}</h2><div>${facts(d)}</div><p class="hint">No explicit dependencies: no asset, trigger or sensor links this DAG to another.</p>` + openLink;
    return;
  }
  const down = dagHops(d.id, outM, depthLimit.down), up = dagHops(d.id, inM, depthLimit.up);
  const SRC = {rendered: 'rendered fields', source: 'DAG source', logs: 'task log'};
  const why = d.inferred ? `<p class="hint">inferred from ${esc(SRC[d.inferred] || d.inferred)}` +
    (d.kind === 'guard' ? '; a deploy guard: it waits for the upstream DAG <b>not</b> to be running.' : '.') + '</p>' : '';
  // Hops are grouped; each row: name, the link it came through, and the failing marker.
  const hopGroups = hops => {
    if (!hops.length) return '<p class="hint">none</p>';
    const out = [];
    let cur = 0;
    hops.forEach(h => {
      if (h.hop !== cur) { if (cur) out.push('</ul>'); cur = h.hop; out.push(`<h4>${h.hop} hop${h.hop > 1 ? 's' : ''}</h4><ul>`); }
      const n = byId.get(h.id);
      out.push(`<li data-id="${esc(n.id)}">${failing(n) ? '⚠ ' : ''}${esc(n.label)}${n.hl ? ' ★' : ''}` +
        `${h.via ? ` <span class="hint">· via ${esc(h.via)}</span>` : ''}${nodeMap.has(n.id) ? '' : ' <span class="hint">(hidden)</span>'}</li>`);
    });
    out.push('</ul>');
    return out.join('');
  };
  side.innerHTML = `<h2>${esc(d.label)}</h2><div>${facts(d)}</div>` + hiddenNote(d) + why +
    `<h3>↓ Downstream (${down.length}) <button type="button" class="copy" id="copyDown">Copy</button></h3>${hopGroups(down)}` +
    `<h3>↑ Upstream (${up.length}) <button type="button" class="copy" id="copyUp">Copy</button></h3>${hopGroups(up)}` +
    openLink;
  wireRows(side);
  document.getElementById('copyDown').onclick = e => copyText(hopText(down), e.target);
  document.getElementById('copyUp').onclick = e => copyText(hopText(up), e.target);
  wireReveal(d);
}

function wireReveal(d) {
  const b = document.getElementById('reveal');
  if (b) b.onclick = () => reveal(d.id);
}

function select(id) {
  selectedId = id; searchKeep = null; depthLimit = {up: Infinity, down: Infinity};
  renderSide(byId.get(id));
  applyHighlight();
  syncHash();
}

function applyHighlight() {
  const hl = box('hl').checked;
  const keep = searchKeep || (selectedId ? chain(selectedId) : null);
  focusKeep = keep;
  const lit = d => hl && d.hl;
  const outline = d => d.inferred ? css(d.kind === 'guard' ? '--guard' : '--c-sensor') : null;
  root.selectAll('g.n').style('opacity', d => (keep && !keep.has(d.id)) ? .12 : 1)
    .each(function (d) { d3.select(this).select('circle,rect,path').attr('stroke', lit(d) ? css('--fg') : outline(d)).attr('stroke-width', lit(d) ? 2 : (d.inferred ? 1.5 : null)); });
  root.selectAll('line').style('opacity', l => keep ? ((keep.has(l.source.id) && keep.has(l.target.id)) ? .9 : .05) : .6)
    .attr('stroke', l => keep && keep.has(l.source.id) && keep.has(l.target.id) ? css('--acc') : css(l.guard ? '--guard' : '--edge'));
  updateLabels();
}

function fitBox(x0, x1, y0, y1, single) {
  const pad = 60, k = Math.max(0.15, Math.min(single ? 1.6 : 2, (W() - 2 * pad) / Math.max(x1 - x0, 1), (H() - 2 * pad) / Math.max(y1 - y0, 1)));
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(W() / 2 - k * (x0 + x1) / 2, H() / 2 - k * (y0 + y1) / 2).scale(k));
}
// Fit to the given nodes, min to max (a search focuses on these exact nodes).
function fitTo(ids) {
  const ns = ids.map(i => nodeMap.get(i)).filter(n => n && n.x != null);
  if (!ns.length) return;
  fitBox(d3.min(ns, n => n.x), d3.max(ns, n => n.x), d3.min(ns, n => n.y), d3.max(ns, n => n.y), ns.length === 1);
}
// Fit to all shown nodes, ignoring the outer 2% on each side so far-off small components do not shrink the graph.
function fitAll() {
  const ns = nodes.filter(n => n.x != null);
  if (!ns.length) return;
  const xs = ns.map(n => n.x).sort(d3.ascending), ys = ns.map(n => n.y).sort(d3.ascending);
  fitBox(d3.quantile(xs, .02), d3.quantile(xs, .98), d3.quantile(ys, .02), d3.quantile(ys, .98), ns.length === 1);
}

const SEARCH_RE = /__SEARCH_RE__/;
// A sandboxed iframe (the Airflow plugin page) blocks popups: open links in the frame there.
// Small graphs label every DAG; large ones only hubs and failing DAGs.
const SMALL = DATA.nodes.filter(n => n.type === 'dag' && !n.unlinked).length <= 60;
const LINK_TARGET = window.self !== window.top ? '' : ' target="_blank" rel="noopener"';
// "2+dag+3": leading +/digits = upstream (depth), trailing +/digits = downstream. No "+" at all = plain substring.
function parseQuery(raw) {
  const t = raw.trim();
  if (!t) return null;
  const m = SEARCH_RE.exec(t);
  if (!m || (m[1] === undefined && m[3] === undefined)) return {text: t.toLowerCase(), plus: false};
  const depth = s => s ? parseInt(s, 10) : Infinity;
  return {text: m[2].toLowerCase(), plus: true, up: m[1] !== undefined, upDepth: depth(m[1]), down: m[3] !== undefined, downDepth: depth(m[3])};
}

function runSearch(fit) {
  const p = parseQuery(qEl.value);
  selectedId = null; searchKeep = null; lastTargets = []; depthLimit = {up: Infinity, down: Infinity};
  pendingFit = false; initialSearch = false;  // the search takes the view
  if (!p) { renderSide(null); applyHighlight(); return; }
  if (!p.plus) {
    // Visible nodes first; a match hidden by the filters still opens, with a way to show it.
    const n = nodes.find(x => x.label.toLowerCase().includes(p.text)) || DATA.nodes.find(x => x.label.toLowerCase().includes(p.text));
    if (!n) { renderSide(null, 'No match'); applyHighlight(); return; }
    select(n.id);
    lastTargets = [n.id];
    if (fit) fitTo(lastTargets);
    return;
  }
  const dags = DATA.nodes.filter(n => n.type === 'dag' && n.label.toLowerCase().includes(p.text));
  const exact = dags.filter(n => n.label.toLowerCase() === p.text);
  const hits = (exact.length ? exact : dags).map(n => n.id);
  if (!hits.length) { renderSide(null, 'No match'); applyHighlight(); return; }
  const keep = new Set(hits);
  if (p.up) reach(hits, inM, p.upDepth).forEach(x => keep.add(x));
  if (p.down) reach(hits, outM, p.downDepth).forEach(x => keep.add(x));
  depthLimit = {up: p.up ? p.upDepth : Infinity, down: p.down ? p.downDepth : Infinity};
  renderSide(byId.get(hits[0]));
  selectedId = hits[0]; searchKeep = keep;
  applyHighlight();
  lastTargets = [...keep].filter(id => nodeMap.has(id));
  if (fit) fitTo(lastTargets);
}

const NEG = [['allLinks', 'onlyLinked'], ['paused', 'onlyActive'], ['allTags', 'onlyTags']];
function syncHash() {  // keep the URL fragment in step with the toggles and the search text
  const parts = [];
  if (qEl.value.trim()) parts.push('q=' + encodeURIComponent(qEl.value.trim()));
  ['onlyFail', 'hideAssets', 'hl', 'blast'].forEach(id => { if (box(id).checked) parts.push(id); });
  // These default to on, so the hash carries their negation (conn defaults to off).
  NEG.forEach(([flag, id]) => { if (!box(id).checked) parts.push(flag); });
  if (box('conn').checked) parts.push('conn');
  if (box('showGuards').checked) parts.push('guards');
  if (selectedId) parts.push('sel=' + encodeURIComponent(selectedId));
  try { history.replaceState(null, '', parts.length ? '#' + parts.join(',') : location.pathname + location.search); } catch (e) { /* file:// or sandboxed */ }
}
qEl.addEventListener('input', () => { runSearch(true); syncHash(); });
['hideAssets', 'onlyFail', 'onlyLinked', 'onlyActive', 'onlyTags', 'conn'].forEach(id => box(id).addEventListener('change', () => { buildView(); if (!selectedId) renderSide(null); syncHash(); }));
box('blast').addEventListener('change', () => { buildView(); if (!selectedId) renderSide(null); syncHash(); });
box('hl').addEventListener('change', () => { applyHighlight(); syncHash(); });
box('fit').addEventListener('click', () => fitAll());
box('showGuards').addEventListener('change', () => { buildAdj(); buildView(); if (selectedId) renderSide(byId.get(selectedId)); syncHash(); });
svg.on('click', ev => { if (ev.target === svg.node()) { selectedId = null; searchKeep = null; depthLimit = {up: Infinity, down: Infinity}; renderSide(null); applyHighlight(); syncHash(); } });
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => { if (sim) draw(); });
}

// Snapshot time with its age, e.g. "snapshot 2026-10-22 06:00 UTC (3 h ago)".
function ago(at) {
  const min = Math.floor((Date.now() - at) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  const h = Math.floor(min / 60);
  return h < 48 ? `${h} h ago` : plural(Math.floor(h / 24), 'day', 'days') + ' ago';
}
const SNAP_AT = Date.parse(META.snapshot || '');
if (!isNaN(SNAP_AT)) {
  const when = new Date(SNAP_AT).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
  box('stats').textContent = box('stats').textContent.replace(/snapshot [^·]*/, `snapshot ${when} (${ago(SNAP_AT)})`);
}
box('filtersBtn').addEventListener('click', () => document.body.classList.toggle('filters-open'));
if (!DATA.nodes.some(n => n.hl)) box('hlWrap').hidden = true;
box('lgHl').hidden = !DATA.nodes.some(n => n.hl);
if (!DATA.nodes.some(n => n.kind === 'guard')) { box('guardWrap').hidden = true; box('lgGuard').hidden = true; }
if (!DATA.nodes.some(n => n.inferred && n.kind !== 'guard')) box('lgInf').hidden = true;
if (TAGS.length) box('tagLbl').textContent = 'only tags: ' + TAGS.join(', ');
else { box('tagWrap').hidden = true; box('connWrap').hidden = true; }
if (META.airflow_version) { box('ver').textContent = 'Airflow ' + META.airflow_version; box('ver').hidden = false; }

// Hash flags: #q=<text>,onlyFail,hideAssets,hl,allLinks,paused,allTags,conn,guards,blast,sel=<node id> (any subset)
const flags = location.hash.replace(/^#/, '').split(',').filter(Boolean);
['hideAssets', 'onlyFail', 'hl', 'conn', 'blast'].forEach(id => { if (flags.includes(id)) box(id).checked = true; });
if (flags.includes('guards') && !box('guardWrap').hidden) { box('showGuards').checked = true; buildAdj(); }
NEG.forEach(([flag, id]) => { if (flags.includes(flag)) box(id).checked = false; });
renderSide(null);
buildView();
const qf = flags.find(f => f.startsWith('q='));
if (qf) {
  let text = qf.slice(2);
  try { text = decodeURIComponent(text); } catch (e) { /* keep raw */ }
  qEl.value = text;
  runSearch(false);
  initialSearch = true; pendingFit = true;  // the layout end fits to this search
  setTimeout(() => { if (initialSearch) fitTo(lastTargets); }, 1200);
}
const sf = flags.find(f => f.startsWith('sel='));
if (!qf && sf) {  // a selection from the hash: select it and fit to it once the layout settles
  let id = sf.slice(4);
  try { id = decodeURIComponent(id); } catch (e) { /* keep raw */ }
  if (byId.has(id)) {
    select(id); lastTargets = [id]; initialSearch = true; pendingFit = true;
    setTimeout(() => { if (initialSearch) fitTo(lastTargets); }, 1200);
  }
}
</script>
</body>
</html>
