# Example airflow-depgraph preset. Copy it to ~/.config/airflow-depgraph/presets/<name>.toml
# and uncomment what you need. Credentials are never stored here, only env var names or a command.

# Preset name, shown in the output.
name = "example"

# Base URL of the Airflow webserver.
# url = "https://airflow.example.com"

# Name of the env var that holds the Airflow user name.
# user_env = "AIRFLOW_USER"

# Name of the env var that holds the Airflow password.
# password_env = "AIRFLOW_PASSWORD"

# Shell command that prints the password to stdout (used when the env var is empty).
# password_cmd = "pass show airflow/example"

# Also fetch the latest run status of every DAG.
# with_status = false

# Also fetch the tasks of every DAG.
# with_tasks = false

# Title of the rendered page.
# title = "Airflow dependency graph"

# Prefix removed from asset names when they are shown as labels.
# asset_label_strip_prefix = "s3://example-bucket/"

# Regex matched against DAG ids (without the dag: prefix); matching DAG nodes are highlighted.
# Assets, triggers and sensors are never highlighted.
# highlight = "^example_"

# Legend label for the highlighted nodes.
# highlight_label = "Highlight"

# Tag prefix shown as chips on the page: with "vertical:" a tag vertical:Sales makes a Sales chip.
# Unset, the page picks the prefix with the most DAGs on its own.
# tag_facet = "vertical:"

# Regex that marks a task as a test task.
# Matches dbt-test-x, dbt_tasks.dbt-test-x, test_models, run_tests (case-insensitive).
# tests_task_regex = '(^|[._-])tests?([._-]|$)'

# Regex used by --tasks-preset. Nothing is filtered at load time; all tasks are fetched.
# task_query_regex = "^(extract|load)_"

# At least this many newest runs are examined for the status, and every run of the last
# status_lookback_days days: a failure buried under frequent runs that did nothing is still seen.
# status_runs_lookback = 5
# status_lookback_days = 7

# Default page filter: only DAGs with any of these tags (the page can switch it off).
# tags = ["team-a"]
# Infer DAG dependencies from Python and custom sensors (fetch/graph; the plugin refreshes them
# in the background). Costs about 3-8 API calls per sensor plus one task list per DAG.
# infer_sensors = false
# Plugin only: minutes between background refreshes of the inferred sensor links.
# infer_interval_minutes = 30
# Mark asset edges hard or soft from each consumer DAG's asset schedule (one GET
# /dags/{id}/details per consumer DAG, in parallel). Soft: "Asset or <cron>", an "any" condition,
# or an asset only read as a task inlet.
# edge_strength = true

# Seconds to wait for one API request before it fails. Timeouts, 429 and 502-504 are retried twice.
# timeout = 25

# Parallel API requests for run status, task lists and sensor inference.
# workers = 8

# Read the run status from bulk listings (fewer calls); false reads each DAG on its own.
# bulk_status = true
