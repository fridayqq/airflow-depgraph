[project]
name = "airflow-depgraph"
version = "0.3.0"
description = "Fetch, query and render the Airflow 3 cross-DAG dependency graph"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aleksandr Smolin", email = "asmolin189@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
airflow-depgraph = "airflow_depgraph.cli:main"

[project.entry-points."airflow.plugins"]
airflow_depgraph = "airflow_depgraph.airflow_plugin:DepGraphPlugin"

[project.urls]
Homepage = "https://github.com/fridayqq/airflow-depgraph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_depgraph"]

[dependency-groups]
dev = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.hatch.build]
artifacts = [
    "src/airflow_depgraph/templates/**",
    "src/airflow_depgraph/vendor/**",
    "src/airflow_depgraph/presets/**",
]
