[project]
name = "airflow-depgraph"
dynamic = ["version"]
description = "Fetch, query and render the Airflow 3 cross-DAG dependency graph"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aleksandr Smolin", email = "asmolin189@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["airflow", "apache-airflow", "dag", "dependencies", "lineage", "graph", "dbt"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Apache Airflow",
    "Environment :: Plugins",
    "Topic :: System :: Monitoring",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
airflow-depgraph = "airflow_depgraph.cli:main"

[project.entry-points."airflow.plugins"]
airflow_depgraph = "airflow_depgraph.airflow_plugin:DepGraphPlugin"

[project.urls]
Homepage = "https://github.com/fridayqq/airflow-depgraph"
Changelog = "https://github.com/fridayqq/airflow-depgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/fridayqq/airflow-depgraph/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_depgraph"]

[dependency-groups]
dev = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.hatch.build]
artifacts = [
    "src/airflow_depgraph/templates/**",
    "src/airflow_depgraph/vendor/**",
    "src/airflow_depgraph/presets/**",
]

[tool.hatch.version]
path = "src/airflow_depgraph/__init__.py"

[tool.pytest.ini_options]
markers = [
    "contract: live test against a running Airflow; runs only when DEPGRAPH_CONTRACT_URL is set",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
